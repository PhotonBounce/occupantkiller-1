plugins {
    id 'com.android.application'
}

android {
    namespace 'io.occupantkiller.app'
    compileSdk 34

    defaultConfig {
        applicationId 'io.occupantkiller.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // A debug-style keystore is generated by the CI workflow so the release APK
    // is signed and installable. This is NOT a Play Store upload key.
    signingConfigs {
        release {
            // A relative OK_KEYSTORE (e.g. "ok-release.keystore") must resolve
            // against the Gradle root dir (android/), NOT this app module dir
            // (android/app/), which is where a bare file() would look. The CI
            // keytool step writes the keystore to android/ok-release.keystore.
            def ksPath = System.getenv('OK_KEYSTORE') ?: 'ok-release.keystore'
            def ksFile = new File(ksPath)
            if (!ksFile.isAbsolute()) {
                ksFile = new File(rootProject.projectDir, ksPath)
            }
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv('OK_KEYSTORE_PASS') ?: 'occupant'
                keyAlias System.getenv('OK_KEY_ALIAS') ?: 'occupant'
                keyPassword System.getenv('OK_KEY_PASS') ?: 'occupant'
            }
            // If absent, storeFile stays unset so debug/other tasks still
            // configure; the CI 'Verify keystore' step guards assembleRelease.
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // androidx.webkit gives us WebViewAssetLoader, which serves the bundled game
    // (app/src/main/assets/www/) over a real https origin
    // (https://appassets.androidplatform.net/assets/...) instead of file:// —
    // so fetch()/localStorage/DOMStorage/WebGL behave exactly as on the web.
    implementation 'androidx.webkit:webkit:1.11.0'
}
