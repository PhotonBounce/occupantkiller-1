plugins {
    id 'com.android.application'
}

android {
    namespace 'io.occupantkiller.app'
    compileSdk 34

    defaultConfig {
        applicationId 'io.occupantkiller.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // A debug-style keystore is generated by the CI workflow so the release APK
    // is signed and installable. This is NOT a Play Store upload key.
    signingConfigs {
        release {
            def ksPath = System.getenv('OK_KEYSTORE') ?: "${rootDir}/ok-release.keystore"
            def ksFile = file(ksPath)
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv('OK_KEYSTORE_PASS') ?: 'occupant'
                keyAlias System.getenv('OK_KEY_ALIAS') ?: 'occupant'
                keyPassword System.getenv('OK_KEY_PASS') ?: 'occupant'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No runtime deps: MainActivity uses only the platform android.webkit.*
    // WebView and extends android.app.Activity with a platform Material theme.
}
