name: Showcase Gallery

# Captures the public gameplay gallery: every mission played in god mode with
# frames N seconds apart, plus every weapon in live fire, then builds the
# gallery page and publishes it to the website.
#
# Runs here rather than in the dev sandbox because the sandbox cannot boot the
# game reliably enough for an unattended run of this size, and cannot reach FTP.
#
# Deliberately a handful of long jobs rather than a wide matrix: a 24-job
# fan-out exceeded the runner concurrency available and most shards sat waiting
# instead of running — two finished in 35 minutes. One job now covers several
# missions from a single boot.
#
# Publishes to: ftp.photon-bounce.com  ->  /occupantkiller/gallery/
# (needs the same FTP_PASSWORD secret the other ftp-* workflows use; without it
# the upload step skips cleanly and the gallery is still downloadable as an
# artifact.)

on:
  # workflow_dispatch only becomes available once this file reaches the default
  # branch, so until #85 merges the capture is driven by pushes that actually
  # change the capture itself — not by every commit to the branch.
  push:
    branches: [ claude/peaceful-cannon-oqez4t ]
    paths:
      - 'tools/capture-showcase.js'
      - 'tools/build-showcase-gallery.js'
      - '.github/workflows/showcase-gallery.yml'
  workflow_dispatch:
    inputs:
      frames:
        description: 'Gameplay frames per mission'
        default: '10'
      interval_ms:
        description: 'Milliseconds between frames'
        default: '5000'

permissions:
  contents: read

concurrency:
  group: showcase-gallery
  cancel-in-progress: true

jobs:
  missions:
    name: missions ${{ matrix.label }}
    runs-on: ubuntu-latest
    # 50, not 60, with the script budgeted to stop at 40: a job killed at the
    # runner limit uploads nothing, so the capture has to give up on its own
    # terms while there is still time to hand back the frames it took.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: '0-6',   stages: '0,1,2,3,4,5,6' }
          - { label: '7-12',  stages: '7,8,9,10,11,12' }
          - { label: '13-18', stages: '13,14,15,16,17,18' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Playwright
        run: npm i -D playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Capture missions ${{ matrix.label }}
        env:
          MODE: stage
          STAGES: ${{ matrix.stages }}
          FRAMES: ${{ github.event.inputs.frames || '10' }}
          INTERVAL_MS: ${{ github.event.inputs.interval_ms || '5000' }}
          PORT: '4900'
          OUT: showcase-out
          SHARD: m${{ matrix.label }}
          BUDGET_MS: '2400000'
        run: |
          # An EXTERNAL kill, because an internal one cannot be trusted here.
          # Jobs have hung inside chromium.launch() with both our own deadline
          # and Playwright's internal launch timeout failing to fire — two
          # independent timers that never fire means the node event loop is
          # blocked, and no in-process guard survives that. `timeout` is a
          # separate process, so it still fires.
          set +e
          timeout --signal=KILL 2100 node tools/capture-showcase.js
          rc=$?
          echo "exit=$rc"
          if [ $rc -eq 124 ] || [ $rc -eq 137 ]; then
            echo "::warning::HUNG — killed externally at 2100s"
          fi
          n=$(ls showcase-out/*.jpg 2>/dev/null | wc -l)
          echo "images captured: $n"
          # Fail honestly on an empty shard. The upload runs on !cancelled(),
          # so a partial shard still hands back what it got.
          if [ "$n" -eq 0 ]; then echo "::error::no frames captured"; exit 1; fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: shots-missions-${{ matrix.label }}
          path: showcase-out/
          retention-days: 7

  arsenal:
    name: weapons ${{ matrix.wstart }}-${{ matrix.wend }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wstart: 0,  wend: 62 }
          - { wstart: 63, wend: 124 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Playwright
        run: npm i -D playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Capture weapons ${{ matrix.wstart }}-${{ matrix.wend }}
        env:
          MODE: weapons
          STAGE: '0'
          WSTART: ${{ matrix.wstart }}
          WEND: ${{ matrix.wend }}
          PORT: '4900'
          OUT: showcase-out
          SHARD: w${{ matrix.wstart }}
          BUDGET_MS: '2400000'
        run: |
          # An EXTERNAL kill, because an internal one cannot be trusted here.
          # Jobs have hung inside chromium.launch() with both our own deadline
          # and Playwright's internal launch timeout failing to fire — two
          # independent timers that never fire means the node event loop is
          # blocked, and no in-process guard survives that. `timeout` is a
          # separate process, so it still fires.
          set +e
          timeout --signal=KILL 2100 node tools/capture-showcase.js
          rc=$?
          echo "exit=$rc"
          if [ $rc -eq 124 ] || [ $rc -eq 137 ]; then
            echo "::warning::HUNG — killed externally at 2100s"
          fi
          n=$(ls showcase-out/*.jpg 2>/dev/null | wc -l)
          echo "images captured: $n"
          # Fail honestly on an empty shard. The upload runs on !cancelled(),
          # so a partial shard still hands back what it got.
          if [ "$n" -eq 0 ]; then echo "::error::no frames captured"; exit 1; fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: shots-weapons-${{ matrix.wstart }}
          path: showcase-out/
          retention-days: 7

  publish:
    name: build + publish gallery
    needs: [missions, arsenal]
    # Needs write access to push the generated gallery to its own branch.
    permissions:
      contents: write
    # Not always(): on a cancelled run there are no artifacts to collect, and
    # this job then "failed" on a red check that was really just the cancel.
    # !cancelled() still publishes whatever the shards that DID finish produced.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Collect every shard
        uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          path: collected
          merge-multiple: true
      - name: Show what landed
        run: |
          echo "images: $(find collected -name '*.jpg' | wc -l)"
          echo "manifests: $(find collected -name 'manifest-*.json' | wc -l)"
      - name: Build gallery
        env:
          IN: collected
          OUT: showcase-gallery
          INTERVAL_MS: ${{ github.event.inputs.interval_ms || '5000' }}
        run: node tools/build-showcase-gallery.js
      - uses: actions/upload-artifact@v4
        with:
          name: showcase-gallery
          path: showcase-gallery/
          retention-days: 30

      # The dev container cannot download Actions artifacts: their URLs redirect
      # to productionresultssa*.blob.core.windows.net, which the network policy
      # blocks. Putting the gallery on a branch makes it reachable over plain
      # git, so it can be reviewed in the PR and fetched without the artifact
      # store — and it keeps a copy that outlives the 30-day retention.
      #
      # Its own branch rather than this one: the capture runs on every push to
      # the feature branch, and a CI commit landing there would race whatever
      # is being pushed by hand at the time.
      - name: Commit the gallery to the gallery-build branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          SRC="$PWD/showcase-gallery"
          if [ ! -d "$SRC" ]; then echo "no gallery to publish"; exit 0; fi
          WORK=$(mktemp -d)
          REMOTE="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          if ! git clone --quiet --depth 1 --branch gallery-build "$REMOTE" "$WORK" 2>/dev/null; then
            echo "gallery-build branch does not exist yet — creating it"
            git clone --quiet --depth 1 "$REMOTE" "$WORK"
            git -C "$WORK" checkout --quiet --orphan gallery-build
            git -C "$WORK" rm -rqf .
          fi
          rm -rf "$WORK/gallery"
          mkdir -p "$WORK/gallery"
          cp -r "$SRC"/. "$WORK/gallery/"
          git -C "$WORK" config user.name  "github-actions[bot]"
          git -C "$WORK" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$WORK" add -A gallery
          if git -C "$WORK" diff --cached --quiet; then
            echo "gallery unchanged — nothing to push"
          else
            git -C "$WORK" commit -qm "Showcase gallery built from ${{ github.sha }}"
            git -C "$WORK" push -q origin gallery-build
            echo "pushed to gallery-build: $(find "$SRC" -name '*.jpg' | wc -l) images"
          fi

      - name: Check FTP secret presence
        id: gate
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FTP_PASSWORD not set — gallery built but not published. Download the showcase-gallery artifact instead."
          fi

      - name: Publish to photon-bounce.com /occupantkiller/gallery/
        if: steps.gate.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.photon-bounce.com
          username: photonb
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./showcase-gallery/
          server-dir: /occupantkiller/gallery/
          dangerous-clean-slate: true

      - name: Link
        if: steps.gate.outputs.ready == 'true'
        run: echo "Gallery published -> https://photon-bounce.com/occupantkiller/gallery/"
