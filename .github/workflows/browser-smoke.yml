name: Browser Smoke

# Answers one question in under a minute: can a browser start on this runner?
#
# Capture and usability jobs have hung inside chromium.launch() for 24-59
# minutes printing nothing, with BOTH a 120s deadline of ours and Playwright's
# own 30s launch timeout failing to fire. Two independent timers that never
# fire means the event loop is blocked, so nothing in-script can rescue it and
# nothing about the GAME can be concluded — the browser never reached it.
#
# Five flag variants in parallel, each wrapped in a hard shell `timeout` so a
# blocked Node loop cannot outlive its step, plus the runner's memory and disk
# at launch time. Whichever variants pass tell the capture tools what to use.

on:
  push:
    branches: [ claude/peaceful-cannon-oqez4t ]
    paths:
      - 'tools/browser-smoke.js'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.mode }} / ${{ matrix.flags }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Baseline: a bare launch. Already measured at 0.1s with these exact
          # flags, so anything slower below is caused by what the mode adds.
          - { flags: current, mode: blank,  secs: 240 }
          # The one structural difference between the passing smoke test and
          # the hanging capture tools: the static server is started first and
          # the browser is launched from inside its listen callback.
          - { flags: current, mode: server, secs: 240 }
          # Server + the real game page, to time an actual boot.
          - { flags: current, mode: game,   secs: 600 }
          # Same, on ANGLE, in case the game's WebGL use is what stalls.
          - { flags: angle,   mode: game,   secs: 600 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Runner resources
        run: |
          echo "--- memory ---";  free -m
          echo "--- cpus ---";    nproc
          echo "--- disk ---";    df -h / /dev/shm || true
      - name: Install Playwright
        run: npm i -D playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Smoke — ${{ matrix.mode }} / ${{ matrix.flags }}
        env:
          FLAGS: ${{ matrix.flags }}
          MODE: ${{ matrix.mode }}
          PORT: '4955'
        # A hard external kill at 4 minutes. `timeout` is a separate process, so
        # it still fires when the node process is wedged and its own timers are
        # not running. Exit 124 means it was killed — reported, not swallowed.
        run: |
          set +e
          timeout --signal=KILL ${{ matrix.secs }} node tools/browser-smoke.js
          rc=$?
          echo "exit=$rc"
          if [ $rc -eq 124 ] || [ $rc -eq 137 ]; then
            echo "::warning::${{ matrix.mode }}/${{ matrix.flags }} HUNG — killed at ${{ matrix.secs }}s"
          fi
          echo "--- memory after ---"; free -m
          exit 0
