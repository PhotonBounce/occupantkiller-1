name: Deploy to GitHub Pages

# Publishes the playable browser game to GitHub Pages.
# The game is 100% static (no backend needed — api-client.js degrades
# gracefully when offline), so Pages can serve it directly.
#
# ── ONE-TIME SETUP (repo owner) ────────────────────────────────────────────
# GitHub's built-in Actions token CANNOT enable Pages on a fork (it gets 403),
# so Pages must be turned on once by hand:
#   Settings → Pages → Build and deployment → Source → "GitHub Actions"
#   (direct link: https://github.com/PhotonBounce/occupantkiller-1/settings/pages)
# Until that's done this workflow skips the deploy with a warning (stays green).
# After it's done, every push to main publishes automatically.
#
# ── WHY DEPLOY ONLY RUNS ON main ───────────────────────────────────────────
# The auto-created `github-pages` environment restricts deployments to the
# default branch (main). A deploy job that references that environment from a
# feature branch (claude/**, copilot/**) is REJECTED by environment branch
# protection in ~1s before any step runs — a hard CI failure we can't skip
# from the workflow. So the deploy job is gated to main; feature branches run
# only the (harmless) gate check. To enable per-branch PREVIEW deploys, the
# repo owner can one-time add a branch pattern under
#   Settings → Environments → github-pages → Deployment branches and tags
# and then loosen the `if:` on the deploy job below.
#
# Live URL once deployed: https://photonbounce.github.io/occupantkiller-1/
# (root game = /, microsite copy = /microsite/play/, QA gallery = /qa-gallery/)

on:
  push:
    branches:
      - main
      - 'copilot/**'
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Job 1: gate ──────────────────────────────────────────────────────────
  # Checks whether Pages is enabled WITHOUT touching the github-pages
  # environment, so the workflow never fails due to environment protection
  # rules on feature branches.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check whether Pages is enabled
        id: check
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$CODE" = "200" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled — proceeding to deploy."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled yet (API returned $CODE). Enable it once at Settings → Pages → Source: 'GitHub Actions' (https://github.com/${{ github.repository }}/settings/pages), then re-run this workflow. Skipping deploy for now."
          fi

  # ── Job 2: deploy ────────────────────────────────────────────────────────
  # Only runs when Pages is confirmed enabled. Putting the environment
  # declaration here (rather than on the gate job) means the github-pages
  # environment protection rules are only evaluated when we're actually
  # going to deploy — not on every push from a feature branch.
  deploy:
    needs: gate
    # Only deploy from main — the github-pages environment rejects feature
    # branches (see header). On branches this job is skipped, keeping CI green.
    if: needs.gate.outputs.ready == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble lean site (game files only)
        run: |
          mkdir -p _site
          # Copy the whole tree EXCEPT heavy, non-game directories so the
          # published Pages site stays well under the 1 GB limit and deploys
          # fast. tools/ (581 MB of QA output) and microsite/gallery
          # (135 MB of images) are the big ones — neither is needed to play.
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.devcontainer' \
            --exclude '.vscode' \
            --exclude '_site' \
            --exclude 'tools' \
            --exclude 'backend' \
            --exclude 'contracts' \
            --exclude 'admin' \
            --exclude 'reference' \
            --exclude 'memories' \
            --exclude 'supergame_extracted' \
            --exclude 'node_modules' \
            --exclude 'microsite/gallery' \
            --exclude 'microsite/play' \
            --exclude '*.zip' \
            --exclude '*.db' \
            --exclude '*.log' \
            ./ _site/
          touch _site/.nojekyll
          # ── /microsite/play/ is GENERATED, never copied ──────────────────
          # The microsite iframes and links play/index.html as the playable
          # build. It used to be a hand-copied duplicate of the game checked
          # into the repo, which silently rotted: the published copy was 12
          # days behind the real game and still served the fatal keydown crash
          # long after that was fixed at the root. Nobody updates a copy they
          # don't remember exists. So the copy is excluded above and rebuilt
          # here from the same files the root game is served from, which makes
          # the two impossible to drift apart.
          mkdir -p _site/microsite/play
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.devcontainer' \
            --exclude '.vscode' \
            --exclude '_site' \
            --exclude 'tools' \
            --exclude 'backend' \
            --exclude 'contracts' \
            --exclude 'admin' \
            --exclude 'reference' \
            --exclude 'memories' \
            --exclude 'supergame_extracted' \
            --exclude 'node_modules' \
            --exclude 'desktop' \
            --exclude 'microsite' \
            --exclude '*.zip' \
            --exclude '*.db' \
            --exclude '*.log' \
            ./ _site/microsite/play/
          # Fail the deploy rather than publish a microsite whose play button
          # 404s or whose game is a different build from the root one.
          cmp _site/index.html _site/microsite/play/index.html
          echo "microsite/play regenerated from live game ($(find _site/microsite/play -type f | wc -l) files)"
          echo "── Published site size ──"
          du -sh _site
          echo "── Top-level entries ──"
          ls -1 _site | head -40

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: echo "Game published → ${{ steps.deployment.outputs.page_url }}"
