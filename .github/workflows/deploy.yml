name: Deploy to GitHub Pages

# Publishes the playable browser game to GitHub Pages.
# The game is 100% static (no backend needed — api-client.js degrades
# gracefully when offline), so Pages can serve it directly.
#
# Live URL once deployed: https://photonbounce.github.io/occupantkiller-1/
# (root game = /, microsite copy = /microsite/play/, QA gallery = /qa-gallery/)

on:
  push:
    branches:
      - main
      - 'copilot/**'
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages (idempotent)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "Pages enable HTTP status: $STATUS"
          # 201 = created, 409 = already exists — both are success
          if [ "$STATUS" = "201" ]; then
            echo "GitHub Pages successfully enabled."
          elif [ "$STATUS" = "409" ]; then
            echo "GitHub Pages already enabled."
          else
            echo "Unexpected status $STATUS — continuing anyway."
          fi

  deploy:
    needs: enable-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble lean site (game files only)
        run: |
          mkdir -p _site
          # Copy the whole tree EXCEPT heavy, non-game directories so the
          # published Pages site stays well under the 1 GB limit and deploys
          # fast. tools/ (581 MB of QA output) and microsite/gallery
          # (135 MB of images) are the big ones — neither is needed to play.
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.devcontainer' \
            --exclude '.vscode' \
            --exclude '_site' \
            --exclude 'tools' \
            --exclude 'backend' \
            --exclude 'contracts' \
            --exclude 'admin' \
            --exclude 'reference' \
            --exclude 'memories' \
            --exclude 'supergame_extracted' \
            --exclude 'node_modules' \
            --exclude 'microsite/gallery' \
            --exclude '*.zip' \
            --exclude '*.db' \
            --exclude '*.log' \
            ./ _site/
          touch _site/.nojekyll
          echo "── Published site size ──"
          du -sh _site
          echo "── Top-level entries ──"
          ls -1 _site | head -40

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
