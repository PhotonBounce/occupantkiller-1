name: Android Emulator QA

# Real on-device QA the software-GPU sandbox cannot do: build the APK, install it
# into an actual Android emulator, launch the real WebView, and capture SCREENSHOTS
# + logcat (JS console + WebGL/EGL errors). This catches the black-screen startup
# failures (no-WebGL, asset-load, WebView crashes) that headless chromium never
# reproduces. Artifacts (screenshots + logcat) are uploaded for inspection.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]

permissions:
  contents: read

jobs:
  emulator-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle game into APK assets
        run: |
          mkdir -p android/app/src/main/assets/www
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '.devcontainer' \
            --exclude '.vscode' --exclude '_site' --exclude 'tools' \
            --exclude 'backend' --exclude 'contracts' --exclude 'admin' \
            --exclude 'reference' --exclude 'memories' \
            --exclude 'supergame_extracted' --exclude 'node_modules' \
            --exclude 'microsite' --exclude '*.zip' --exclude '*.db' \
            --exclude '*.log' --exclude 'android' \
            --exclude 'screencaptures' --exclude 'qa-gallery' --exclude 'deploy' \
            ./ android/app/src/main/assets/www/
          test -f android/app/src/main/assets/www/index.html || { echo "index.html not bundled"; exit 1; }

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run APK in Android emulator + capture screenshots & logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: |
            set +e
            PKG=io.occupantkiller.app
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            # Force landscape (the game is landscape-only) and launch
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            adb shell monkey -p $PKG -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > qa-01-launch.png
            # Blind taps to dismiss menu / start a mission (center + common start spots)
            adb shell input tap 1280 720
            sleep 2
            adb shell input tap 1280 900
            sleep 2
            adb shell input tap 640 360
            sleep 20
            adb exec-out screencap -p > qa-02-after-start.png
            sleep 15
            adb exec-out screencap -p > qa-03-late.png
            adb logcat -d > qa-logcat.txt
            echo "==================== WEBVIEW CONSOLE / GL / ERRORS ===================="
            grep -iaE 'CONSOLE|chromium|WebGL|GLES|EGL|gralloc|Uncaught|Error|FATAL|ANR|DIAGNOSTIC|OCCUPANT' qa-logcat.txt | tail -120
            echo "======================================================================"
            ls -la qa-*.png

      - name: Upload QA artifacts (screenshots + logcat)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-qa
          path: |
            qa-01-launch.png
            qa-02-after-start.png
            qa-03-late.png
            qa-logcat.txt
          if-no-files-found: warn
